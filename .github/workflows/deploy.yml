name: Deploy to GH Pages (kancil)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Optional: point the Pages build at the public Jev relay worker.
          # Set as a repo variable; when empty the build calls api.typesafe.ai
          # directly (needs our origin allowlisted there).
          VITE_JEV_ENDPOINT: ${{ vars.VITE_JEV_ENDPOINT }}
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
          # cname: kancil.here.now  # uncomment to use custom domain via Pages
